<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Valentino</title>
<meta name="description" content="Happy Birthday, Valentino! Make a wish and blow out the candles.">
<meta property="og:title" content="Happy Birthday, Valentino">
<meta property="og:description" content="Make a wish and blow out the candles.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: a night-time garden party. String lights across the top, balloons drifting behind,
   then a polaroid and a cake side by side, then a handwritten note. One deliberate dark look. */
:root {
  --night: #10202b;
  --night-2: #183243;
  --paper: #fff7ec;
  --ink: #2a2230;
  --coral: #ff6b5a;
  --gold: #ffc94d;
  --mint: #5fd3b5;
  --pink: #ff8fb8;
  --muted: #a9bcc8;
  --wire: #3c5566;
  --font-display: "Grandstander", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(1200px 700px at 50% -10%, var(--night-2), var(--night) 70%) fixed, var(--night);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 50; }

/* String lights */
.lights { position: relative; z-index: 2; height: 56px; margin-inline: auto; max-width: 1200px; }
.lights svg { position: absolute; inset: 0; width: 100%; height: 40px; overflow: visible; }
.lights path { fill: none; stroke: var(--wire); stroke-width: 2; vector-effect: non-scaling-stroke; }
.bulb {
  position: absolute; width: 12px; height: 16px; margin-left: -6px;
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  background: var(--c); box-shadow: 0 0 14px 3px var(--c);
  animation: twinkle 2.4s ease-in-out infinite; animation-delay: var(--d);
}
.bulb::before { content: ""; position: absolute; top: -5px; left: 3px; width: 6px; height: 6px; border-radius: 2px; background: var(--wire); }
@keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .45; box-shadow: 0 0 4px 1px var(--c); } }

main {
  position: relative; z-index: 1;
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 64px;
  display: grid; gap: 48px;
}

/* Hero */
.hero { text-align: center; display: grid; gap: 6px; justify-items: center; }
.eyebrow { font-weight: 700; text-transform: uppercase; letter-spacing: .18em; font-size: 13px; color: var(--mint); }
h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800;
  font-size: clamp(44px, 10vw, 104px); line-height: 1; color: var(--gold);
  text-shadow: 3px 4px 0 var(--coral), 6px 8px 0 rgba(0,0,0,.25);
  text-wrap: balance;
}
h1 .ch { display: inline-block; animation: bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
h1 .sp { display: inline-block; width: .3em; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8px) rotate(-3deg); } 50% { transform: translateY(0) rotate(0); } }
.name {
  font-family: var(--font-hand); font-weight: 700; color: var(--mint);
  text-shadow: 0 0 18px rgba(95, 211, 181, .45);
  font-size: clamp(40px, 7vw, 72px); line-height: 1.1; padding: 0 .2em;
  transform: rotate(-3deg); display: inline-block;
}
.hint { font-size: 13px; color: var(--muted); }

.editable { border-radius: 6px; outline: none; cursor: text; unicode-bidi: plaintext; text-decoration: underline dashed transparent; text-underline-offset: 6px; transition: text-decoration-color .2s, background .2s; }
.editable:hover { text-decoration-color: currentColor; }
.editable:focus-visible, .editable:focus { background: rgba(255,255,255,.08); text-decoration-color: currentColor; }

/* Stage */
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; justify-items: center; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; gap: 56px; } }

/* Polaroid */
.polaroid-wrap { display: grid; gap: 14px; justify-items: center; width: 100%; }
.polaroid {
  width: min(340px, 100%); background: var(--paper); color: var(--ink);
  padding: 14px 14px 48px; border-radius: 4px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
  transform-origin: 50% -30px; animation: swing 5s ease-in-out infinite;
  position: relative;
}
.polaroid::before {
  content: ""; position: absolute; top: -14px; left: 50%; width: 86px; height: 26px; margin-left: -43px;
  background: rgba(255, 201, 77, .75); transform: rotate(-4deg);
}
@keyframes swing { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(2deg); } }
.photo {
  aspect-ratio: 1 / 1; max-width: 100%; width: 100%; background: #e9dfd2; overflow: hidden;
}
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: 72% 40%; display: block; }
.photo.drag { outline: 3px dashed var(--coral); outline-offset: -8px; }
.placeholder { display: grid; gap: 10px; justify-items: center; color: #7a6c62; padding: 16px; text-align: center; }
.placeholder svg { width: 54px; height: 54px; }
.placeholder strong { font-family: var(--font-display); font-size: 20px; color: var(--ink); }
.caption { font-family: var(--font-hand); font-size: 30px; text-align: center; padding-top: 6px; min-height: 1.4em; color: var(--ink); }
.photo-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* Cake */
.cake-wrap { display: grid; gap: 18px; justify-items: center; width: 100%; }
.cake { position: relative; width: 280px; height: 250px; max-width: 100%; cursor: pointer; }
.plate { position: absolute; bottom: 0; left: 0; width: 280px; height: 28px; border-radius: 50%; background: #dfe7ec; box-shadow: inset 0 -5px 0 #b9c7d0, 0 10px 24px rgba(0,0,0,.4); }
.tier { position: absolute; border-radius: 16px 16px 20px 20px; }
.t1 { bottom: 14px; left: 20px; width: 240px; height: 86px; background: linear-gradient(var(--pink), #f06a9e); }
.t2 { bottom: 94px; left: 50px; width: 180px; height: 64px; background: linear-gradient(#fff3e2, #f6dcc0); }
.t1::after { content: ""; position: absolute; left: 0; right: 0; bottom: 18px; height: 10px; background: repeating-linear-gradient(90deg, var(--paper) 0 10px, transparent 10px 20px); opacity: .55; border-radius: 6px; }
.drip { position: absolute; top: 0; left: 0; right: 0; height: 30px; display: flex; gap: 3px; padding: 0 4px; }
.drip span { flex: 1; background: var(--gold); border-radius: 0 0 10px 10px; }
.t2 .drip { border-radius: 16px 16px 0 0; overflow: hidden; }
.sprinkle { position: absolute; width: 10px; height: 4px; border-radius: 2px; }
.candles { position: absolute; bottom: 152px; left: 50px; width: 180px; display: flex; justify-content: space-evenly; }
.candle {
  position: relative; width: 11px; height: 46px; border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--paper) 0 6px, var(--c) 6px 12px);
}
.candle::before { content: ""; position: absolute; top: -6px; left: 5px; width: 1.5px; height: 7px; background: #3a2c22; }
.flame {
  position: absolute; left: 50%; bottom: 52px; width: 15px; height: 24px; margin-left: -7.5px;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background: radial-gradient(circle at 50% 75%, #fffbe6 0 18%, var(--gold) 40%, var(--coral) 85%);
  box-shadow: 0 0 18px 6px rgba(255, 190, 80, .55);
  transform-origin: 50% 90%; animation: flicker .9s ease-in-out infinite alternate;
  transition: opacity .25s, transform .25s;
}
.candle:nth-child(2n) .flame { animation-duration: .7s; }
.candle:nth-child(3n) .flame { animation-duration: 1.1s; }
@keyframes flicker { 0% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.08, .94) rotate(2deg); } 100% { transform: scale(.94, 1.06) rotate(-1deg); } }
.cake.out .flame { opacity: 0; transform: scale(.2) translateY(6px); animation: none; }
.smoke { position: absolute; left: 50%; bottom: 52px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: rgba(220,230,236,.6); opacity: 0; pointer-events: none; }
.cake.out .smoke { animation: smoke 1.6s ease-out forwards; }
@keyframes smoke { 0% { opacity: .8; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-60px) translateX(8px) scale(2.6); } }
.wish { font-family: var(--font-hand); font-size: 30px; color: var(--mint); min-height: 1.3em; text-align: center; line-height: 1.2; }

/* Buttons */
.btn {
  appearance: none; border: 2px solid transparent; cursor: pointer;
  font: 700 15px/1 var(--font-body); padding: 13px 20px; border-radius: 999px;
  background: var(--coral); color: #2a0f0b;
  box-shadow: 0 4px 0 #b8402f; transition: transform .1s, box-shadow .1s, background .2s;
}
.btn:hover { background: #ff7f70; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8402f; }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--paper); border-color: var(--wire); box-shadow: none; }
.btn.ghost:hover { border-color: var(--muted); }
.btn.small { padding: 9px 14px; font-size: 13px; }
.btn.small.ghost { color: var(--paper); }

/* Note */
.note {
  justify-self: center; width: min(640px, 100%);
  background: var(--paper); color: var(--ink);
  border-radius: 6px; padding: 32px clamp(20px, 5vw, 44px) 28px;
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
  background-image: repeating-linear-gradient(transparent 0 35px, rgba(42,34,48,.09) 35px 36px);
  transform: rotate(.6deg);
  display: grid; gap: 12px;
}
.note h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--coral); }
.note .msg { font-family: var(--font-hand); font-size: 30px; line-height: 36px; max-width: 60ch; text-align: center; text-wrap: balance; }
.note .from { font-family: var(--font-hand); font-size: 27px; text-align: right; color: #7a4b8c; }

.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
footer { text-align: center; color: var(--muted); font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  h1 .ch, .polaroid, .bulb, .flame { animation: none !important; }
}
</style>
</head>

    get(k) { try { return localStorage.getItem('bday.' + k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem('bday.' + k) : localStorage.setItem('bday.' + k, v); return true; } catch (e) { return false; } }
  };

  /* Title letters */
  const title = document.getElementById('title');
  title.innerHTML = [...title.textContent].map((c, i) =>
    c === ' ' ? '<span class="sp"></span>' : `<span class="ch" aria-hidden="true" style="--i:${i}">${c}</span>`).join('');

  /* String lights along two droops: y = 2 + 14t(1-t) per half */
  const lights = document.getElementById('lights');
  const N = innerWidth < 600 ? 11 : 17;
  for (let i = 0; i < N; i++) {
    const x = i / (N - 1) * 100;
    const t = (x % 50) / 50;
    const y = (2 + 14 * t * (1 - t)) * 4;
    const b = document.createElement('span');
    b.className = 'bulb';
    b.style.cssText = `left:${x}%;top:${y + 4}px;--c:${COLORS[i % 5]};--d:${(i * 0.37) % 2.4}s`;
    lights.appendChild(b);
  }

  /* Cake decoration */
  const drip = (el, n) => { for (let i = 0; i < n; i++) { const s = document.createElement('span'); s.style.height = (10 + Math.random() * 20) + 'px'; s.style.alignSelf = 'flex-start'; el.appendChild(s); } };
  drip(document.getElementById('drip1'), 14);
  drip(document.getElementById('drip2'), 10);
  const tier1 = document.getElementById('tier1');
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.className = 'sprinkle';
    s.style.cssText = `left:${8 + Math.random() * 84}%;top:${36 + Math.random() * 28}%;background:${COLORS[i % 6]};transform:rotate(${Math.random() * 180}deg)`;
    tier1.appendChild(s);
  }
  const candles = document.getElementById('candles');
  ['#ff6b5a', '#5fd3b5', '#ffc94d', '#8fb8ff', '#ff8fb8'].forEach(c => {
    const el = document.createElement('div');
    el.className = 'candle';
    el.style.setProperty('--c', c);
    el.innerHTML = '<div class="flame"></div><div class="smoke"></div>';
    candles.appendChild(el);
  });

  /* Canvases */
  const sky = document.getElementById('sky'), fx = document.getElementById('fx');
  const sctx = sky.getContext('2d'), fctx = fx.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [sky, fx]) { c.width = W * dpr; c.height = H * dpr; }
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  /* Balloons */
  const balloons = [];
  const makeBalloon = (startAnywhere) => {
    const r = 22 + Math.random() * 20;
    return {
      x: Math.random() * W, y: startAnywhere ? Math.random() * H : H + r * 4,
      r, color: COLORS[Math.floor(Math.random() * 5)],
      speed: (0.25 + Math.random() * 0.45) * (reduce ? 0.2 : 1),
      phase: Math.random() * Math.PI * 2, sway: 0.4 + Math.random() * 0.6
    };
  };
  const balloonCount = () => Math.max(6, Math.min(16, Math.round(W / 90)));
  for (let i = 0; i < balloonCount(); i++) balloons.push(makeBalloon(true));

  function drawBalloon(b, t) {
    const sx = Math.sin(t / 1200 + b.phase) * 10 * b.sway;
    const x = b.x + sx, y = b.y, r = b.r;
    sctx.save();
    sctx.globalAlpha = 0.88;
    sctx.strokeStyle = 'rgba(255,247,236,.35)';
    sctx.lineWidth = 1;
    sctx.beginPath();
    sctx.moveTo(x, y + r);
    sctx.quadraticCurveTo(x - sx * 1.5, y + r * 2.2, x + Math.sin(t / 900 + b.phase) * 6, y + r * 3.4);
    sctx.stroke();
    const g = sctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.1);
    g.addColorStop(0, 'rgba(255,255,255,.75)');
    g.addColorStop(0.25, b.color);
    g.addColorStop(1, b.color);
    sctx.fillStyle = g;
    sctx.beginPath();
    sctx.ellipse(x, y, r * 0.86, r, 0, 0, Math.PI * 2);
    sctx.fill();
    sctx.fillStyle = b.color;
    sctx.beginPath();
    sctx.moveTo(x, y + r - 2); sctx.lineTo(x - 5, y + r + 6); sctx.lineTo(x + 5, y + r + 6);
    sctx.closePath(); sctx.fill();
    sctx.restore();
    b.drawX = x;
  }

  /* Confetti */
  const bits = [];
  function burst(x, y, n, colors = COLORS, spread = 1) {
    if (reduce) n = Math.round(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 6) * spread;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: colors[Math.floor(Math.random() * colors.length)], life: 0 });
    }
  }
  function rain(n) {
    if (reduce) n = Math.round(n / 4);
    for (let i = 0; i < n; i++) {
      bits.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 1.5, vy: 1 + Math.random() * 2,
        w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.2,
        c: COLORS[Math.floor(Math.random() * COLORS.length)], life: 0 });
    }
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(2, (t - last) / 16.7); last = t;
    sctx.clearRect(0, 0, W, H);
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      b.y -= b.speed * dt;
      if (b.y < -b.r * 4) Object.assign(b, makeBalloon(false));
      drawBalloon(b, t);
    }
    fctx.clearRect(0, 0, W, H);
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i];
      p.vy += 0.12 * dt; p.vx *= 0.99; p.vy = Math.min(p.vy, 5);
      p.x += p.vx * dt + Math.sin((t / 300) + i) * 0.4; p.y += p.vy * dt; p.rot += p.vr * dt; p.life += dt;
      if (p.y > H + 30) { bits.splice(i, 1); continue; }
      fctx.save();
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillStyle = p.c;
      fctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.rot * 2)), p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 0.5);
      fctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => rain(140), 300);

  const party = () => { rain(160); burst(W / 2, H * 0.35, 80); };

  /* Press: pop a balloon if one is under the pointer, otherwise confetti.
     Buttons and the cake keep their own actions. */
  addEventListener('pointerdown', e => {
    if (e.target.closest('button, input, a, #cake')) return;
    for (let i = balloons.length - 1; i >= 0; i--) {
      const b = balloons[i];
      const dx = (e.clientX - b.drawX) / (b.r * 0.9), dy = (e.clientY - b.y) / (b.r * 1.05);
      if (dx * dx + dy * dy <= 1) {
        burst(b.drawX, b.y, 40, [b.color, '#fff7ec', '#ffc94d']);
        pop();
        Object.assign(b, makeBalloon(false));
        return;
      }
    }
    party();
  });

  /* Sound */
  let actx = null;
  const audio = () => { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; };
  function pop() {
    try {
      const a = audio(), o = a.createOscillator(), g = a.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(600, a.currentTime); o.frequency.exponentialRampToValueAtTime(90, a.currentTime + 0.12);
      g.gain.setValueAtTime(0.25, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.15);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.16);
    } catch (e) {}
  }

  // The traditional tune (public domain), in 3/4.
  const F = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const TUNE = [
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]
  ];
  let songBus = null, songTimer = null;
  function stopSong() {
    if (songBus) { try { songBus.gain.cancelScheduledValues(0); songBus.gain.setTargetAtTime(0, actx.currentTime, 0.05); } catch (e) {} songBus = null; }
    clearTimeout(songTimer);
  }
  function playSong() {
    let a;
    try { a = audio(); } catch (e) { return; }
    stopSong();
    const bus = a.createGain(); bus.gain.value = 0.22; bus.connect(a.destination); songBus = bus;
    const beat = 0.5;
    let t = a.currentTime + 0.08;
    for (const [n, d] of TUNE) {
      const dur = d * beat;
      [['triangle', 1, 1], ['sine', 0.5, 0.35]].forEach(([type, mult, vol]) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = type; o.frequency.value = F[n] * mult;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + Math.max(dur * 0.95, 0.12));
        o.connect(g).connect(bus); o.start(t); o.stop(t + dur);
      });
      t += dur;
    }
    songTimer = setTimeout(stopSong, (t - a.currentTime) * 1000 + 200);
  }

  /* Candles */
  const cake = document.getElementById('cake'), wish = document.getElementById('wish'), blowBtn = document.getElementById('blow');
  function toggleCandles() {
    if (!cake.classList.contains('out')) {
      cake.classList.add('out');
      cake.setAttribute('aria-label', 'Birthday cake with the candles blown out');
      wish.textContent = 'Wish made! It’s on its way.';
      blowBtn.textContent = 'Light the candles again';
      const r = cake.getBoundingClientRect();
      setTimeout(() => { burst(r.left + r.width / 2, r.top + 20, 160, COLORS, 1.4); rain(80); }, 350);
      if (!songBus) setTimeout(playSong, 500);
    } else {
      cake.classList.remove('out');
      cake.setAttribute('aria-label', 'Birthday cake with lit candles');
      wish.textContent = 'Make a wish…';
      blowBtn.textContent = 'Blow out the candles';
    }
  }
  blowBtn.addEventListener('click', toggleCandles);
  cake.addEventListener('click', toggleCandles);


})();
</script>

</body>
</html>
